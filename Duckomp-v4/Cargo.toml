# Adding Dict documentation/logging en mass to MD for Obdisian observation. 
[package]
name = "Duckomp-v4"
version = "0.4.0"
edition = "2021"

[dependencies]
rayon = "1.12.0"
memmap2 = "0.9"
ahash = "0.8"
aho-corasick = "1"
memchr = "2"
time = { version = "0.3", features = ["macros", "formatting"] }

[profile.release]
opt-level = 3        # maximum optimization (default is already 3, but explicit)
lto = true           # link-time optimization, makes binary faster
codegen-units = 1    # slower to compile but faster to run