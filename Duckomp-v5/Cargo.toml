[package]
name = "Duckomp-v5"
version = "0.4.0"
edition = "2021"

[dependencies]
rayon = "1.12.0"
memmap2 = "0.9"
ahash = "0.8"
aho-corasick = "1"
memchr = "2"
time = { version = "0.3", features = ["macros", "formatting"] }
wgpu = "22"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
